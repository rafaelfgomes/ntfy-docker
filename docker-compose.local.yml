services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=${TIMEZONE:-Etc/UTC}
    user: ${PUID:-1000}:${PGID:-1000}
    volumes:
      - ${NTFY_CACHE_DIR:-./ntfy/cache}:/var/cache/ntfy
      - ${NTFY_CONFIG_DIR:-./ntfy/config}:/etc/ntfy
    ports:
      - ${NTFY_PORT:-80}:80
    healthcheck:
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:${NTFY_PORT:-80}/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    init: true
    networks:
      local:
        ipv4_address: 172.${SUBNET_NUMBER:-20}.0.2

networks:
  local:
    name: ntfy-local-network
    ipam:
      config:
        - subnet: 172.${SUBNET_NUMBER:-20}.0.0/16